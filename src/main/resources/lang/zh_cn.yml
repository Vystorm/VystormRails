# 通过 Vystorm Core 提供的 /rails：每位玩家看到自己语言的说明、帮助和 Tab 补全。commands.rails 下的 "aliases" 是额外的
# 主命令（全服生效，由管理员在 Core 配置 commands.localized-aliases 中选择语言）；子命令的 "name" 和 "aliases"
# 在所有语言中都可使用，英文始终有效。
stations-header: "<gold>车站：显示 {shown} 个，共 {total} 个匹配项（由近到远）"
stations-entry: "<gray>• <aqua>{station}</aqua> — {distance} 米，XYZ：{x}, {y}, {z}"
stations-empty: "<gray>当前世界没有匹配的已知命名车站。"
stations-hint: "<gray>搜索：<yellow>/rails 车站 名称</yellow> · 前往：<yellow>/rails 目的地 名称</yellow>"
commands:
  rails:
    description: "矿车：目的地、线路图、矿车信息和矿车方块"
    aliases: [铁轨]
    sub:
      dest:
        name: 目的地
        aliases: []
        description: "显示或设置你的目的地——道岔会把矿车送往那里；清除 可删除目的地"
        args:
          name: "车站|清除"
      line:
        name: 线路
        aliases: []
        description: "管理列车线路与有序时刻表"
        args:
          action: "操作"
      departures:
        name: 发车
        aliases: []
        description: "查看车站计划发车时间"
        args:
          station: "车站"
      map:
        name: 地图
        aliases: [线路图]
        description: "打开线路图"
      stations:
        name: 车站
        aliases: []
        description: "查找当前世界已知的车站，按距离排序"
        args:
          search: "搜索"
      favorite:
        name: 收藏
        aliases: []
        description: "将已知车站保存为个人收藏"
        args:
          name: "车站"
      favorites:
        name: 收藏夹
        aliases: []
        description: "打开当前世界的收藏车站"
      ticket:
        name: ticket
        aliases: []
        description: "你的日票；购买可免费乘车 24 小时"
        sub:
          buy:
            name: buy
            aliases: []
            description: "购买日票"
      fare:
        name: fare
        aliases: []
        description: "管理员：查看或设置车站票价"
        args:
          station: "STATION"
          amount: "AMOUNT"
      info:
        name: 信息
        aliases: []
        description: "你的矿车的速度、目的地、所有者和列车"
      blocks:
        name: 方块
        aliases: []
        description: "本服务器的加速方块和矿车方块"
      uncouple:
        name: 脱钩
        aliases: []
        description: "把你乘坐或看着的矿车从列车上脱钩"
      reload:
        name: 重载
        aliases: []
        description: "重新加载配置和语言文件"

