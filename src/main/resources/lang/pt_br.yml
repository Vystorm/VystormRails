commands:
  rails:
    description: 'Minecarts: destino, mapa de rede, informações do carrinho e blocos de carrinho'
    aliases: []
    sub:
      dest:
        name: dest
        aliases: []
        description: Mostrar ou definir seu destino - interruptores enviar seu carrinho lá; claro remove-lo
        args:
          name: STATION|clear
      line:
        name: line
        aliases: []
        description: "Gerenciar linhas e horários ordenados"
        args:
          action: "AÇÃO"
      departures:
        name: departures
        aliases: []
        description: "Mostrar partidas programadas da estação"
        args:
          station: "ESTAÇÃO"
      map:
        name: map
        aliases: []
        description: Abra o mapa da rede
      stations:
        name: stations
        aliases: []
        description: Encontre estações conhecidas neste mundo, mais próximas primeiro
        args:
          search: SEARCH
      favorite:
        name: favorite
        aliases: []
        description: Salve uma estação conhecida como favorita
        args:
          name: STATION
      favorites:
        name: favorites
        aliases: []
        description: Abra seus favoritos para este mundo
      ticket:
        name: ticket
        aliases: []
        description: "Seu bilhete diário; compre 24 horas de viagens grátis"
        sub:
          buy:
            name: buy
            aliases: []
            description: "Comprar um bilhete diário"
      fare:
        name: fare
        aliases: []
        description: "Admin: ver ou definir tarifas das estações"
        args:
          station: "STATION"
          amount: "AMOUNT"
      info:
        name: info
        aliases: []
        description: Velocidade, destino, dono e trem do seu carrinho
      blocks:
        name: blocks
        aliases: []
        description: Blocos de velocidade e carrinhos deste servidor
      uncouple:
        name: uncouple
        aliases: []
        description: Desagrupe o carro que você monta ou olhe do trem
      reload:
        name: reload
        aliases: []
        description: Recarregar arquivos de configuração e linguagem
