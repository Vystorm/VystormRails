stations-empty: "<gray>Keine passenden bekannten benannten Bahnhöfe in dieser Welt."
stations-hint: "<gray>Suchen: <yellow>/rails bahnhoefe NAME</yellow> · Reisen: <yellow>/rails ziel NAME</yellow>"
commands:
  rails:
    description: "Loren: Ziel, Streckenkarte, Loren-Info und Lorenblöcke"
    aliases: [schienen]
    sub:
      dest:
        name: ziel
        aliases: [reiseziel]
        description: "Ziel anzeigen oder setzen – Weichen schicken deine Lore dorthin; löschen entfernt es"
        args:
          name: "BAHNHOF|löschen"
      line:
        name: linie
        aliases: []
        description: "Zuglinien und geordnete Fahrpläne verwalten"
        args:
          action: "AKTION"
      departures:
        name: abfahrten
        aliases: []
        description: "Planmäßige Abfahrten am Bahnhof anzeigen"
        args:
          station: "BAHNHOF"
      map:
        name: karte
        aliases: [streckenkarte]
        description: "Streckenkarte öffnen"
      stations:
        name: bahnhoefe
        aliases: []
        description: "Bekannte Bahnhöfe dieser Welt finden, nächste zuerst"
        args:
          search: "SUCHE"
      favorite:
        name: favorit
        aliases: []
        description: "Bekannten Bahnhof als persönlichen Favoriten speichern"
        args:
          name: "BAHNHOF"
      favorites:
        name: favoriten
        aliases: []
        description: "Deine Favoriten dieser Welt öffnen"
      ticket:
        name: ticket
        aliases: []
        description: "Deine Tageskarte; kauf eine für 24 Stunden freie Fahrt"
        sub:
          buy:
            name: buy
            aliases: []
            description: "Eine Tageskarte kaufen"
      fare:
        name: fare
        aliases: []
        description: "Admin: Fahrpreise der Bahnhöfe zeigen oder setzen"
        args:
          station: "STATION"
          amount: "AMOUNT"
      info:
        name: info
        aliases: []
        description: "Tempo, Ziel, Besitzer und Zug deiner Lore"
      blocks:
        name: bloecke
        aliases: [blöcke]
        description: "Tempoblöcke und Lorenblöcke dieses Servers"
      uncouple:
        name: abkoppeln
        aliases: []
        description: "Die Lore, in der du sitzt oder die du ansiehst, vom Zug abkoppeln"
      reload:
        name: neuladen
        aliases: []
        description: "Konfiguration und Sprachdateien neu laden"

