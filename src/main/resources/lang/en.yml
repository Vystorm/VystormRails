# /rails through Vystorm Core: description, help and tab completion per player. "aliases" under commands.rails are extra
# root commands (server-wide, the admin chooses which languages: Core config commands.localized-aliases); "name" and
# "aliases" of a subcommand are accepted in every language, English always works.
stations-header: "<gold>Stations: {shown} of {total} matches (nearest first)"
stations-entry: "<gray>• <aqua>{station}</aqua> — {distance} m, XYZ: {x}, {y}, {z}"
stations-empty: "<gray>No known named stations match in this world."
stations-hint: "<gray>Search: <yellow>/rails stations NAME</yellow> · Travel: <yellow>/rails dest NAME</yellow>"
commands:
  rails:
    description: "Minecarts: destination, network map, cart info and cart blocks"
    aliases: []
    sub:
      dest:
        name: dest
        aliases: []
        description: "Show or set your destination – switches send your cart there; clear removes it"
        args:
          name: "STATION|clear"
      line:
        name: line
        aliases: []
        description: "Manage train lines and ordered timetables"
        args:
          action: "ACTION"
      departures:
        name: departures
        aliases: []
        description: "Show scheduled station departures"
        args:
          station: "STATION"
      map:
        name: map
        aliases: []
        description: "Open the network map"
      stations:
        name: stations
        aliases: []
        description: "Find known stations in this world, nearest first"
        args:
          search: "SEARCH"
      favorite:
        name: favorite
        aliases: []
        description: "Save a known station as a personal favorite"
        args:
          name: "STATION"
      favorites:
        name: favorites
        aliases: []
        description: "Open your favorites for this world"
      ticket:
        name: ticket
        aliases: []
        description: "Your day ticket; buy one for 24 hours of free rides"
        sub:
          buy:
            name: buy
            aliases: []
            description: "Buy a day ticket"
      fare:
        name: fare
        aliases: []
        description: "Admin: show or set station fares"
        args:
          station: "STATION"
          amount: "AMOUNT"
      info:
        name: info
        aliases: []
        description: "Speed, destination, owner and train of your cart"
      blocks:
        name: blocks
        aliases: []
        description: "Speed blocks and cart blocks of this server"
      uncouple:
        name: uncouple
        aliases: []
        description: "Uncouple the cart you ride or look at from its train"
      reload:
        name: reload
        aliases: []
        description: "Reload config and language files"

