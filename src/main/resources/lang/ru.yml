        description: "Админ: показать или задать тарифы станций"
        args:
          station: "STATION"
          amount: "AMOUNT"
      info:
        name: info
        aliases: []
        description: Скорость, пункт назначения, владелец и поезд вашей тележки
      blocks:
        name: blocks
        aliases: []
        description: Блоки скорости и блоки карт этого сервера
